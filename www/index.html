<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a"><title>Games</title>
<style>
:root{--bg:#0a0a0a;--card:#141414;--raise:#222;--tx:#9a9a9a;--hd:#f0f0f0;--ac:#ff4655;--ol:rgba(255,255,255,.14);--gl:0 0 14px rgba(255,70,85,.45);--red:#ff4655;--rt:#ff8a93}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
.v{display:none;position:absolute;inset:0;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);overflow-y:auto}
.v.on{display:flex}
header{display:flex;align-items:center;gap:10px;height:54px;flex:none;border-bottom:1px solid rgba(255,70,85,.3)}
h1{color:var(--red);text-shadow:0 0 18px rgba(255,70,85,.4)}header h2{border-left:3px solid var(--red);padding-left:8px}
button.sn{width:40px;min-width:40px;padding:0;margin-left:auto;font-size:17px;flex:none}header h2+button.sn,header .sn:not(:first-of-type){margin-left:0}
h1,h2{margin:0;color:var(--hd);font-weight:500}h1{font-size:28px}h2{font-size:20px;flex:1}
button{font:inherit;color:var(--hd);background:var(--raise);border:1px solid var(--ol);border-radius:16px;min-height:44px;padding:0 14px}
button:active,button.on{box-shadow:var(--gl);border-color:var(--ac)}
button[hidden]{display:none}
.bk{width:44px;padding:0;font-size:22px}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:2px 0 8px;flex:none;flex-wrap:wrap}
.bar>div{display:flex;gap:6px;align-items:center}
.bar button{min-height:40px;padding:0 12px;border-radius:12px}
.stat{background:var(--card);border:1px solid rgba(255,70,85,.45);border-radius:12px;padding:8px 12px;color:var(--hd);min-width:64px;text-align:center}
.gc{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--ol);border-left:3px solid var(--red);border-radius:16px;padding:16px;text-align:left;height:auto;width:100%;margin-bottom:14px}
.gc .i{font-size:32px;width:56px;height:56px;border-radius:16px;background:var(--raise);display:flex;align-items:center;justify-content:center;color:var(--ac);flex:none}
.gc .i svg{width:30px;height:30px}.gc b{color:var(--hd);font-size:18px;font-weight:500}.gc small{color:var(--tx)}
.wrap{flex:1;overflow:auto;display:flex;touch-action:pan-x pan-y;min-height:0}
.grid{margin:auto;display:grid;gap:2px}
#solBoard{touch-action:none;flex:none;--g:4px}
.top,.tab{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--g);margin-bottom:8px}
.sl,.col{position:relative}
.k .ix{position:absolute;left:3px;top:2px;display:flex;flex-direction:column;align-items:center;line-height:1;white-space:nowrap;font-size:calc(var(--cw)*.26);letter-spacing:-.04em}.k .ix.z{left:auto;top:auto;right:3px;bottom:2px;transform:rotate(180deg)}.k .ix u{text-decoration:none}.k .ix u+u{font-size:.86em;margin-top:1px;letter-spacing:0}
.k i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-style:normal;font-size:calc(var(--cw)*.56);line-height:1}
.ov{position:fixed;inset:0;background:rgba(5,7,11,.85);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--hd);font-size:22px;z-index:20}.ov.on{display:flex}
#c4Board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:6px;background:var(--card);border:1px solid var(--ol);border-radius:16px;overflow:hidden;width:100%;max-width:440px;margin:auto}
.cl{display:grid;gap:4px}.h{aspect-ratio:1;border-radius:50%;background:var(--bg);position:relative}
.d{position:absolute;inset:0;border-radius:50%}
.p1{background:radial-gradient(circle at 35% 30%,#ff9aa3,#e8283a 60%);box-shadow:0 0 10px rgba(232,40,58,.55)}
.p2{background:radial-gradient(circle at 35% 30%,#fff0a8,#ffc533 60%);box-shadow:0 0 10px rgba(255,197,51,.5)}
.dp{animation:dr .42s cubic-bezier(.45,0,.9,.6)}@keyframes dr{from{transform:translateY(calc(var(--n)*-115%))}}
.w{animation:pl .7s infinite alternate;outline:3px solid #fff}@keyframes pl{to{filter:brightness(1.5)}}
#skW,#plW,#frW,#gwW{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;border:1px solid var(--ol);border-radius:16px;background:var(--card);box-shadow:inset 0 0 24px rgba(255,255,255,.15);margin-bottom:8px}#skC,#plC,#frC,#gwC{position:absolute;inset:0;width:100%;height:100%}
.bd{display:grid;grid-template-columns:repeat(8,1fr);width:100%;max-width:440px;margin:auto;border:1px solid var(--ol);border-radius:12px;overflow:hidden;box-shadow:0 0 14px rgba(255,255,255,.15)}
.q{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;background:#1a1a1a}.q.l{background:#333}
.q.la{background:#5a2a2f}.q.s{box-shadow:inset 0 0 0 3px var(--ac)}.q.in{background:#9a2433}
.q.m::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:var(--ac);opacity:.75}
.pc{font-size:min(9vw,40px);line-height:1}.pw{color:#f0f0f0;text-shadow:0 0 5px rgba(255,255,255,.35)}.pb{color:#808080;text-shadow:0 0 6px rgba(0,0,0,.8)}
.cp{width:76%;height:76%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:min(5vw,22px);line-height:1;color:#111}
.cr{background:radial-gradient(circle at 35% 30%,#ff9aa3,#e8283a 65%);box-shadow:0 0 10px rgba(232,40,58,.55);color:#3a0008}
.cw{background:radial-gradient(circle at 35% 30%,#fff,#cfcfcf 65%);box-shadow:0 0 8px rgba(255,255,255,.3)}
.sub{font-size:13px;color:var(--rt);font-weight:400;margin-left:4px}
/* start screen */
#mnB{padding-bottom:24px}
.big{width:100%;min-height:64px;text-align:left;border-radius:16px;margin-bottom:12px;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:10px 16px}
.big b{font-size:18px;font-weight:500}.big small{opacity:.8;font-size:13px}
.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.lbl{margin:14px 2px 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--rt)}
.sg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.sg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--ol);border-radius:16px;padding:4px 14px}
.sr{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--ol)}
.sr:last-child{border-bottom:0}.sr b{color:var(--hd);font-weight:500;text-align:right}
/* minesweeper: covered cells are raised and light, opened cells are flat and dark */
.c{width:var(--s);height:var(--s);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--s)*.55);color:var(--hd);background:linear-gradient(145deg,#8c8c8c,#545454);border:1px solid #adadad;box-shadow:inset 2px 2px 0 rgba(255,255,255,.22),inset -2px -2px 0 rgba(0,0,0,.35)}
.c.o{background:#0b0b0b;border:1px solid #2a2a2a;box-shadow:inset 0 2px 4px rgba(0,0,0,.85)}
.c.f{color:#ff4655}.c.m{color:#ff8a93}.c.x{background:#e0202b;border-color:#ff8a93;color:#fff;box-shadow:none}
.n1{color:#5aa9ff}.n2{color:#4cd98a}.n3{color:#ff6b6b}.n4{color:#9bc4ff}.n5{color:#ffb04d}.n6{color:#3dd9d1}.n7{color:#f0f0f0}.n8{color:#bdbdbd}
/* solitaire: ivory face cards, striped red backs, visible empty slots */
.sl{aspect-ratio:5/7;border:2px dashed rgba(255,255,255,.3);background:rgba(255,255,255,.05);border-radius:6px;color:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw)*.5)}
.col::before{content:"";display:block;aspect-ratio:5/7;border:2px dashed rgba(255,255,255,.18);border-radius:6px}
.k{position:absolute;left:0;top:0;width:100%;aspect-ratio:5/7;border-radius:6px;background:#fff;border:1px solid #8a8a8a;color:#16161a;font-size:calc(var(--cw)*.3);font-weight:700;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.8)}
.k.r{color:#e01c2b}
.k.d{background:repeating-linear-gradient(45deg,#e0202b 0 4px,#a3121c 4px 8px);border:3px solid #fff;color:transparent}
.k.s{background:#e6e6e6;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac),0 0 14px rgba(255,255,255,.7)}
.k.g{opacity:.25}
.gh .k{box-shadow:0 6px 16px rgba(0,0,0,.85),0 0 0 2px var(--ac)}
#gw .bar b{min-width:44px;text-align:center;color:var(--hd)}#gw .bar .sub{margin:0}#gw button:disabled{opacity:.35}
</style></head><body>
<div id="home" class="v on"><header><h1>Games</h1></header>
<button class="gc" data-g="mines"><span class="i">✹</span><span><b>Minesweeper</b><br><small id="hs-mines"></small></span></button>
<button class="gc" data-g="sol"><span class="i">♠</span><span><b>Solitaire</b><br><small id="hs-sol"></small></span></button>
<button class="gc" data-g="c4"><span class="i">●</span><span><b>Connect 4</b><br><small id="hs-c4"></small></span></button>
<button class="gc" data-g="stick"><span class="i"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="7" r="3.8" fill="currentColor" stroke="none"/><path d="M16 12v10M16 15l-7 5M16 15l7-4M16 22l-6 8M16 22l6 8"/></svg></span><span><b>Stick Box</b><br><small>Shake it, throw it, tilt it</small></span></button>
<button class="gc" data-g="pool"><span class="i">⑧</span><span><b>Pool</b><br><small id="hs-pool"></small></span></button>
<button class="gc" data-g="fruit"><span class="i"><svg viewBox="0 0 32 32" fill="currentColor"><circle cx="12" cy="20" r="9"/><circle cx="24" cy="9" r="6"/></svg></span><span><b>Fruit Merge</b><br><small id="hs-fruit"></small></span></button>
<button class="gc" data-g="check"><span class="i">⛀</span><span><b>Checkers</b><br><small id="hs-check"></small></span></button>
<button class="gc" data-g="chess"><span class="i">♞</span><span><b>Chess</b><br><small id="hs-chess"></small></span></button>
<button class="gc" data-g="gw"><span class="i"><svg viewBox="0 0 32 32" fill="currentColor"><circle cx="15" cy="17" r="7"/><ellipse cx="15" cy="17" rx="13" ry="4.5" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(-28 15 17)"/><circle cx="26" cy="6" r="2.4"/></svg></span><span><b>Gravity Wars</b><br><small id="hs-gw"></small></span></button></div>

<div id="menu" class="v"><header><button class="bk" data-back>←</button><h2 id="mnT"></h2></header>
<div id="mnB"></div></div>

<div id="mines" class="v"><header><button class="bk" data-back>←</button><h2>Minesweeper <small class="sub" id="msSub"></small></h2><button id="msNew">New</button></header>
<div class="bar"><div><span class="stat" id="msLeft"></span></div><span id="msMsg"></span></div>
<div class="wrap"><div id="msBoard" class="grid"></div></div>
<div class="bar"><div><button id="msMode">⛏ Reveal</button></div></div></div>

<div id="sol" class="v"><header><button class="bk" data-back>←</button><h2>Solitaire <small class="sub" id="soSub"></small></h2><button id="soNew">New deal</button></header>
<div class="bar"><div><span class="stat" id="soMoves"></span></div><span id="soBest"></span></div>
<div id="solBoard"></div>
<div class="bar"><div><button id="soUndo">↶ Undo</button><button id="soAuto" hidden>Auto-finish</button></div></div>
<div class="ov" id="soWin"><div>🎉 You won!</div><div id="soWinT" style="font-size:16px"></div><button id="soAgain">New deal</button></div></div>

<div id="c4" class="v"><header><button class="bk" data-back>←</button><h2>Connect 4 <small class="sub" id="c4Sub"></small></h2><button id="c4New">Rematch</button></header>
<div class="bar"><span class="stat" id="c4Turn"></span><span class="stat" id="c4Score"></span></div>
<div class="wrap" style="touch-action:none"><div id="c4Board"></div></div></div>

<div id="stick" class="v"><header><button class="bk" data-back>←</button><h2>Stick Box</h2><button id="skReset">Reset</button></header>
<div class="bar"><div><button id="skShake">Shake!</button><button id="skTilt" class="on">Tilt: On</button><button id="skItem">+ Item</button></div><span>Drag anything · tap it</span></div>
<div id="skW"><canvas id="skC"></canvas></div></div>

<div id="pool" class="v"><header><button class="bk" data-back>←</button><h2>Pool <small class="sub" id="plSub"></small></h2><button id="plNew">New</button></header>
<div class="bar"><span class="stat" id="plMsg" style="flex:1"></span></div>
<div id="plW"><canvas id="plC"></canvas></div></div>

<div id="gw" class="v"><header><button class="bk" data-back>←</button><h2>Gravity Wars <small class="sub" id="gwSub"></small></h2><button id="gwNew">New</button></header>
<div class="bar"><span class="stat" id="gwMsg" style="flex:1"></span></div>
<div id="gwW"><canvas id="gwC"></canvas></div>
<div class="bar"><div><span class="sub">Angle</span><button id="gwA-">−</button><b id="gwAv">90°</b><button id="gwA+">+</button></div><div><span class="sub">Power</span><button id="gwP-">−</button><b id="gwPv">60</b><button id="gwP+">+</button></div><button id="gwF" class="pri">FIRE</button></div></div>

<div id="fruit" class="v"><header><button class="bk" data-back>←</button><h2>Fruit Merge <small class="sub" id="frSub"></small></h2><button id="frNew">New</button></header>
<div class="bar"><div><span class="stat" id="frScore"></span><span class="stat" id="frBest"></span></div><span class="stat" id="frNext"></span></div>
<div id="frW"><canvas id="frC"></canvas></div></div>

<div id="check" class="v"><header><button class="bk" data-back>←</button><h2>Checkers <small class="sub" id="ckSub"></small></h2><button id="ckNew">New</button></header>
<div class="bar"><span class="stat" id="ckMsg"></span><button id="ckUndo">↶ Undo</button></div>
<div class="wrap"><div id="ckBd" class="bd"></div></div></div>

<div id="chess" class="v"><header><button class="bk" data-back>←</button><h2>Chess <small class="sub" id="chSub"></small></h2><button id="chNew">New</button></header>
<div class="bar"><span class="stat" id="chMsg"></span><button id="chUndo">↶ Undo</button></div>
<div class="wrap"><div id="chBd" class="bd"></div></div></div>

<div class="ov" id="yn"><div id="ynT" style="font-size:18px;text-align:center;padding:0 28px"></div><div style="display:flex;gap:10px"><button id="ynN" style="padding:0 22px">Cancel</button><button id="ynY" class="pri" style="padding:0 22px">Yes</button></div></div>
<script>
/*LOGIC*/
const red=c=>c.s==1||c.s==2;
function nbrs(i,R,C){const r=i/C|0,c=i%C,o=[];for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){if(!a&&!b)continue;const y=r+a,x=c+b;if(y>=0&&y<R&&x>=0&&x<C)o.push(y*C+x)}return o}
function msPlace(R,C,M,safe){const ex=new Set(nbrs(safe,R,C));ex.add(safe);const p=[];for(let i=0;i<R*C;i++)if(!ex.has(i))p.push(i);
 for(let i=p.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[p[i],p[j]]=[p[j],p[i]]}
 const m=new Uint8Array(R*C);p.slice(0,M).forEach(i=>m[i]=1);return m}
function msCounts(m,R,C){return Array.from(m,(v,i)=>nbrs(i,R,C).reduce((a,j)=>a+m[j],0))}
function msFlood(g,i){const st=[i];let hit=false;while(st.length){const k=st.pop();if(g.rev[k]||g.fl[k])continue;g.rev[k]=1;if(g.m[k]){hit=true;continue}
 if(g.cnt[k]==0)nbrs(k,g.R,g.C).forEach(j=>{if(!g.rev[j])st.push(j)})}return hit}
function msWon(g){for(let i=0;i<g.m.length;i++)if(!g.m[i]&&!g.rev[i])return false;return true}
function msChord(g,i){if(!g.rev[i]||!g.cnt[i])return false;const n=nbrs(i,g.R,g.C);if(n.filter(j=>g.fl[j]).length!=g.cnt[i])return false;let hit=false;n.forEach(j=>{if(!g.rev[j]&&!g.fl[j]&&msFlood(g,j))hit=true});return hit}
function solDeal(n){const d=[];for(let s=0;s<4;s++)for(let r=1;r<=13;r++)d.push({s,r,u:false});for(let i=51;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}
 const tab=[];for(let c=0;c<7;c++){const p=d.splice(0,c+1);p[c].u=true;tab.push(p)}
 return{stock:d,waste:[],found:[[],[],[],[]],tab,moves:0,won:false,n}}
function cardsAt(S,f){if(f.t=='w')return S.waste.length?[S.waste[S.waste.length-1]]:[];if(f.t=='t')return f.k==null?[]:S.tab[f.c].slice(f.k);if(f.t=='f'){const p=S.found[f.c];return p.length?[p[p.length-1]]:[]}return[]}
function canMove(S,f,to){const cs=cardsAt(S,f);if(!cs.length||!cs[0].u)return false;const c=cs[0];
 if(to.t=='f')return cs.length==1&&c.s==to.c&&S.found[to.c].length==c.r-1&&!(f.t=='f'&&f.c==to.c);
 if(to.t=='t'){if(f.t=='t'&&f.c==to.c)return false;const p=S.tab[to.c];if(!p.length)return c.r==13;const t=p[p.length-1];return t.u&&t.r==c.r+1&&red(t)!=red(c)}return false}
function doMove(S,f,to){if(!canMove(S,f,to))return false;let cs;if(f.t=='w')cs=[S.waste.pop()];else if(f.t=='t')cs=S.tab[f.c].splice(f.k);else cs=[S.found[f.c].pop()];
 if(to.t=='f')S.found[to.c].push(...cs);else S.tab[to.c].push(...cs);
 if(f.t=='t'){const p=S.tab[f.c];if(p.length&&!p[p.length-1].u)p[p.length-1].u=true}S.moves++;return true}
function draw(S,n){if(!S.stock.length){if(!S.waste.length)return false;S.stock=S.waste.reverse().map(c=>({s:c.s,r:c.r,u:false}));S.waste=[];S.moves++;return true}
 for(let i=0;i<n&&S.stock.length;i++){const c=S.stock.pop();c.u=true;S.waste.push(c)}S.moves++;return true}
function autoStep(S){const fs=[{t:'w'}];for(let c=0;c<7;c++)if(S.tab[c].length)fs.push({t:'t',c,k:S.tab[c].length-1});
 for(const f of fs){const cs=cardsAt(S,f);if(cs.length&&doMove(S,f,{t:'f',c:cs[0].s}))return true}return false}
const solAllUp=S=>S.tab.every(p=>p.every(c=>c.u));
const solTotal=S=>S.found.reduce((a,p)=>a+p.length,0);
const solSnap=S=>JSON.stringify({stock:S.stock,waste:S.waste,found:S.found,tab:S.tab,moves:S.moves});
const solRestore=(S,s)=>Object.assign(S,JSON.parse(s));
function c4Drop(b,c){for(let r=5;r>=0;r--)if(!b[r*7+c])return r;return -1}
function c4Win(b,r,c,p){for(const[d,e]of[[0,1],[1,0],[1,1],[1,-1]]){const cells=[r*7+c];for(const s of[1,-1]){let y=r+d*s,x=c+e*s;while(y>=0&&y<6&&x>=0&&x<7&&b[y*7+x]==p){cells.push(y*7+x);y+=d*s;x+=e*s}}if(cells.length>=4)return cells}return null}
const WIN=[];for(let r=0;r<6;r++)for(let c=0;c<7;c++)for(const[d,e]of[[0,1],[1,0],[1,1],[1,-1]]){const y=r+3*d,x=c+3*e;if(y<6&&x>=0&&x<7)WIN.push([0,1,2,3].map(k=>(r+k*d)*7+c+k*e))}
function c4Eval(b,ai){const hu=3-ai;let s=0;for(const w of WIN){let a=0,h=0;for(const i of w){if(b[i]==ai)a++;else if(b[i]==hu)h++}if(a&&h)continue;if(a==3)s+=5;else if(a==2)s+=2;if(h==3)s-=6;else if(h==2)s-=2}
 for(let r=0;r<6;r++){if(b[r*7+3]==ai)s+=3;else if(b[r*7+3]==hu)s-=3}return s}
const ORD=[3,2,4,1,5,0,6];
function mm(b,d,al,be,p,ai,last){if(c4Win(b,last[0],last[1],last[2]))return last[2]==ai?100000+d:-100000-d;if(d==0)return c4Eval(b,ai);
 let any=false,best=p==ai?-Infinity:Infinity;
 for(const c of ORD){const r=c4Drop(b,c);if(r<0)continue;any=true;b[r*7+c]=p;const v=mm(b,d-1,al,be,3-p,ai,[r,c,p]);b[r*7+c]=0;

const SKB=26,SKG=.55;
