<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a"><title>Games</title>
<style>
:root{--bg:#0a0a0a;--card:#141414;--raise:#222;--tx:#9a9a9a;--hd:#f0f0f0;--ac:#ff4655;--ol:rgba(255,255,255,.14);--gl:0 0 14px rgba(255,70,85,.45);--red:#ff4655;--rt:#ff8a93}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
.v{display:none;position:absolute;inset:0;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);overflow-y:auto}
.v.on{display:flex}
header{display:flex;align-items:center;gap:10px;height:54px;flex:none;border-bottom:1px solid rgba(255,70,85,.3)}
h1{color:var(--red);text-shadow:0 0 18px rgba(255,70,85,.4)}header h2{border-left:3px solid var(--red);padding-left:8px}
button.sn{width:40px;min-width:40px;padding:0;margin-left:auto;font-size:17px;flex:none}header h2+button.sn,header .sn:not(:first-of-type){margin-left:0}
h1,h2{margin:0;color:var(--hd);font-weight:500}h1{font-size:28px}h2{font-size:20px;flex:1}
button{font:inherit;color:var(--hd);background:var(--raise);border:1px solid var(--ol);border-radius:16px;min-height:44px;padding:0 14px}
button:active,button.on{box-shadow:var(--gl);border-color:var(--ac)}
button[hidden]{display:none}
.bk{width:44px;padding:0;font-size:22px}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:2px 0 8px;flex:none;flex-wrap:wrap}
.bar>div{display:flex;gap:6px;align-items:center}
.bar button{min-height:40px;padding:0 12px;border-radius:12px}
.stat{background:var(--card);border:1px solid rgba(255,70,85,.45);border-radius:12px;padding:8px 12px;color:var(--hd);min-width:64px;text-align:center}
.gc{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--ol);border-left:3px solid var(--red);border-radius:16px;padding:16px;text-align:left;height:auto;width:100%;margin-bottom:14px}
.gc .i{font-size:32px;width:56px;height:56px;border-radius:16px;background:var(--raise);display:flex;align-items:center;justify-content:center;color:var(--ac);flex:none}
.gc .i svg{width:30px;height:30px}.gc b{color:var(--hd);font-size:18px;font-weight:500}.gc small{color:var(--tx)}
.wrap{flex:1;overflow:auto;display:flex;touch-action:pan-x pan-y;min-height:0}
.grid{margin:auto;display:grid;gap:2px}
#solBoard{touch-action:none;flex:none;--g:4px}
.top,.tab{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--g);margin-bottom:8px}
.sl,.col{position:relative}
.k .ix{position:absolute;left:3px;top:2px;display:flex;flex-direction:column;align-items:center;line-height:1;white-space:nowrap;font-size:calc(var(--cw)*.26);letter-spacing:-.04em}.k .ix.z{left:auto;top:auto;right:3px;bottom:2px;transform:rotate(180deg)}.k .ix u{text-decoration:none}.k .ix u+u{font-size:.86em;margin-top:1px;letter-spacing:0}
.k i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-style:normal;font-size:calc(var(--cw)*.56);line-height:1}
.ov{position:fixed;inset:0;background:rgba(5,7,11,.85);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--hd);font-size:22px;z-index:20}.ov.on{display:flex}
.d{position:absolute;inset:0;border-radius:50%}
#skW,#plW,#frW,#brW,#rnW,#bbW,#gaW{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;border:1px solid var(--ol);border-radius:16px;background:var(--card);box-shadow:inset 0 0 24px rgba(255,255,255,.15);margin-bottom:8px}#skC,#plC,#frC,#brC,#rnC,#bbC,#gaC{position:absolute;inset:0;width:100%;height:100%}
.bd{display:grid;grid-template-columns:repeat(8,1fr);width:100%;max-width:440px;margin:auto;border:1px solid var(--ol);border-radius:12px;overflow:hidden;box-shadow:0 0 14px rgba(255,255,255,.15)}
.q{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;background:#1a1a1a}.q.l{background:#333}
.q.la{background:#5a2a2f}.q.s{box-shadow:inset 0 0 0 3px var(--ac)}.q.in{background:#9a2433}
.q.m::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:var(--ac);opacity:.75}
.pc{font-size:min(9vw,40px);line-height:1}.pw{color:#f0f0f0;text-shadow:0 0 5px rgba(255,255,255,.35)}.pb{color:#808080;text-shadow:0 0 6px rgba(0,0,0,.8)}
.sub{font-size:13px;color:var(--rt);font-weight:400;margin-left:4px}
/* start screen */
#mnB{padding-bottom:24px}
.big{width:100%;min-height:64px;text-align:left;border-radius:16px;margin-bottom:12px;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:10px 16px}
.big b{font-size:18px;font-weight:500}.big small{opacity:.8;font-size:13px}
.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.lbl{margin:14px 2px 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--rt)}
.sg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.sg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--ol);border-radius:16px;padding:4px 14px}
.sr{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--ol)}
.sr:last-child{border-bottom:0}.sr b{color:var(--hd);font-weight:500;text-align:right}
/* minesweeper: covered cells are raised and light, opened cells are flat and dark */
.c{width:var(--s);height:var(--s);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--s)*.55);color:var(--hd);background:linear-gradient(145deg,#8c8c8c,#545454);border:1px solid #adadad;box-shadow:inset 2px 2px 0 rgba(255,255,255,.22),inset -2px -2px 0 rgba(0,0,0,.35)}
.c.o{background:#0b0b0b;border:1px solid #2a2a2a;box-shadow:inset 0 2px 4px rgba(0,0,0,.85)}
.c.f{color:#ff4655}.c.m{color:#ff8a93}.c.x{background:#e0202b;border-color:#ff8a93;color:#fff;box-shadow:none}
.n1{color:#5aa9ff}.n2{color:#4cd98a}.n3{color:#ff6b6b}.n4{color:#9bc4ff}.n5{color:#ffb04d}.n6{color:#3dd9d1}.n7{color:#f0f0f0}.n8{color:#bdbdbd}
/* solitaire: ivory face cards, striped red backs, visible empty slots */
.sl{aspect-ratio:5/7;border:2px dashed rgba(255,255,255,.3);background:rgba(255,255,255,.05);border-radius:6px;color:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw)*.5)}
.col::before{content:"";display:block;aspect-ratio:5/7;border:2px dashed rgba(255,255,255,.18);border-radius:6px}
.k{position:absolute;left:0;top:0;width:100%;aspect-ratio:5/7;border-radius:6px;background:#fff;border:1px solid #8a8a8a;color:#16161a;font-size:calc(var(--cw)*.3);font-weight:700;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.8)}
.k.r{color:#e01c2b}
.k.d{background:repeating-linear-gradient(45deg,#e0202b 0 4px,#a3121c 4px 8px);border:3px solid #fff;color:transparent}
.k.s{background:#e6e6e6;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac),0 0 14px rgba(255,255,255,.7)}
.k.g{opacity:.25}
.gh .k{box-shadow:0 6px 16px rgba(0,0,0,.85),0 0 0 2px var(--ac)}
/* text adventure */
#adv{overflow:hidden}
.avp{flex:1;min-height:0;display:flex;flex-direction:column}.avp[hidden]{display:none}
#avRoster,#avNewP{overflow-y:auto;padding-bottom:20px}
.avch{display:flex;gap:8px;align-items:stretch;margin-bottom:12px}.avch .big{margin-bottom:0;flex:1}.avch .bk{min-height:64px;flex:none}
input,textarea{font:inherit;color:var(--hd);background:var(--card);border:1px solid var(--ol);border-radius:14px;padding:10px 12px;min-height:44px;width:100%;outline:0;user-select:text;-webkit-user-select:text}
input:focus,textarea:focus{border-color:var(--ac)}textarea{resize:none;display:block}
#avLog{flex:1;min-height:0;overflow-y:auto;user-select:text;-webkit-user-select:text;padding:8px 2px;line-height:1.45;font-size:15px}
#avLog div{margin:0 0 9px;white-space:pre-wrap;overflow-wrap:anywhere}
.av-r{color:var(--hd);font-weight:600;font-size:17px;border-bottom:1px solid rgba(255,70,85,.3);padding-bottom:3px;margin-top:14px!important}
.av-p{color:var(--rt)}.av-c{color:#ffb04d}.av-b{color:var(--red)}.av-g{color:#4cd98a}.av-d{color:#9bc4ff}.av-s{color:#7d7d7d;font-size:13px}.av-n{color:#cfcfcf}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px;flex:none;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips button{min-height:36px;padding:0 12px;border-radius:12px;white-space:nowrap;flex:none;font-size:14px}
.avin{display:flex;gap:8px;padding:2px 0 8px;flex:none}.avin button{padding:0 14px}
</style></head><body>

<button class="gc" data-g="bub"><span class="i"><svg viewBox="0 0 32 32" fill="currentColor"><circle cx="9" cy="9" r="6"/><circle cx="21" cy="9" r="6" opacity=".7"/><circle cx="15" cy="20" r="6" opacity=".85"/><circle cx="16" cy="29" r="2.2"/></svg></span><span><b>Bubble Shooter</b><br><small id="hs-bub"></small></span></button>
<button class="gc" data-g="gal"><span class="i"><svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 3l3 9h-6z"/><path d="M16 9l6 10 6 4v4l-6-2-2 3h-8l-2-3-6 2v-4l6-4z"/><circle cx="16" cy="6" r="0"/></svg></span><span><b>Galaga</b><br><small id="hs-gal"></small></span></button>
<button class="gc" data-g="dino"><span class="i"><svg viewBox="0 0 32 32" fill="currentColor"><rect x="9" y="9" width="14" height="10" rx="4"/><rect x="17" y="3" width="11" height="9" rx="3"/><path d="M9 13L2 18h7z"/><rect x="11" y="19" width="3.5" height="8" rx="1.5"/><rect x="17.5" y="19" width="3.5" height="8" rx="1.5"/></svg></span><span><b>Dino Run</b><br><small id="hs-dino"></small></span></button>

<div class="ov" id="yn"><div id="ynT" style="font-size:18px;text-align:center;padding:0 28px"></div><div style="display:flex;gap:10px"><button id="ynN" style="padding:0 22px">Cancel</button><button id="ynY" class="pri" style="padding:0 22px">Yes</button></div></div>
<script>
/*LOGIC*/
const red=c=>c.s==1||c.s==2;
function nbrs(i,R,C){const r=i/C|0,c=i%C,o=[];for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){if(!a&&!b)continue;const y=r+a,x=c+b;if(y>=0&&y<R&&x>=0&&x<C)o.push(y*C+x)}return o}
function msPlace(R,C,M,safe){const ex=new Set(nbrs(safe,R,C));ex.add(safe);const p=[];for(let i=0;i<R*C;i++)if(!ex.has(i))p.push(i);
 for(let i=p.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[p[i],p[j]]=[p[j],p[i]]}
 const m=new Uint8Array(R*C);p.slice(0,M).forEach(i=>m[i]=1);return m}
function msCounts(m,R,C){return Array.from(m,(v,i)=>nbrs(i,R,C).reduce((a,j)=>a+m[j],0))}
function msFlood(g,i){const st=[i];let hit=false;while(st.length){const k=st.pop();if(g.rev[k]||g.fl[k])continue;g.rev[k]=1;if(g.m[k]){hit=true;continue}
 if(g.cnt[k]==0)nbrs(k,g.R,g.C).forEach(j=>{if(!g.rev[j])st.push(j)})}return hit}
function msWon(g){for(let i=0;i<g.m.length;i++)if(!g.m[i]&&!g.rev[i])return false;return true}
function msChord(g,i){if(!g.rev[i]||!g.cnt[i])return false;const n=nbrs(i,g.R,g.C);if(n.filter(j=>g.fl[j]).length!=g.cnt[i])return false;let hit=false;n.forEach(j=>{if(!g.rev[j]&&!g.fl[j]&&msFlood(g,j))hit=true});return hit}
function solDeal(n){const d=[];for(let s=0;s<4;s++)for(let r=1;r<=13;r++)d.push({s,r,u:false});for(let i=51;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}
 const tab=[];for(let c=0;c<7;c++){const p=d.splice(0,c+1);p[c].u=true;tab.push(p)}
 return{stock:d,waste:[],found:[[],[],[],[]],tab,moves:0,won:false,n}}
function cardsAt(S,f){if(f.t=='w')return S.waste.length?[S.waste[S.waste.length-1]]:[];if(f.t=='t')return f.k==null?[]:S.tab[f.c].slice(f.k);if(f.t=='f'){const p=S.found[f.c];return p.length?[p[p.length-1]]:[]}return[]}
function canMove(S,f,to){const cs=cardsAt(S,f);if(!cs.length||!cs[0].u)return false;const c=cs[0];
 if(to.t=='f')return cs.length==1&&c.s==to.c&&S.found[to.c].length==c.r-1&&!(f.t=='f'&&f.c==to.c);
 if(to.t=='t'){if(f.t=='t'&&f.c==to.c)return false;const p=S.tab[to.c];if(!p.length)return c.r==13;const t=p[p.length-1];return t.u&&t.r==c.r+1&&red(t)!=red(c)}return false}

const AVGEN=[
 [['name','who','called','yourself'],{maren:`Maren Holloway, proprietor of the Gilded Boar, nursemaid to everyone.`,brum:`Brum. Just Brum. Smiths don't need more.`,pip:`Pipkin. Pip, to customers. Mister Pipkin, to the tax collector.`,odo:`Odo Ferrow. Hunter. Used to be a better one before the leg.`,tobin:`Tobin Marsh. Eighty-one winters and counting.`,lyra:`Lyra of the Seven Roads: bard, borrower and occasional liar.`,wren:`I'm Wren! I'm ten. And three-quarters.`}],
 [['job','trade','occupation','living','business'],{maren:`I keep the inn, the books, the peace and, occasionally, the guests from each other.`,brum:`Steel. Swords, axes, nails. Everything that needs hitting or holding.`,pip:`Provisions. Buying low, selling slightly less low.`,odo:`Hunt. Trap. Track. Skin. The usual.`,tobin:`Farmed for forty years. Now I sit here and criticize the young.`,lyra:`I sing for my supper. Sometimes for breakfast.`,wren:`I run errands! And I watch things. Mostly the watching.`}],
 [['weather','rain','storm','cold','sun','wind','raining'],{maren:`Rain since Tuesday. The roof's doing its best.`,brum:`Wet weather's good for tempering. Bad for everything else.`,pip:`Rain means folks stay in and buy lamp oil. I'm not complaining.`,odo:`Rain washes tracks. I hate the rain.`,tobin:`My knee says more rain, and my knee's never wrong.`,lyra:`Rain is just the sky practicing its percussion.`,wren:`I LOVE rain! Puddles!`}],
 [['village','thistledown','town','home','place'],{maren:`Thistledown's a good village. Dull, mostly. Right up until goblins.`,brum:`Small place. Sturdy people. Poor taste in swords.`,pip:`Great little market, if you squint. Very little competition.`,odo:`Too many people. Not enough trees.`,tobin:`I was born in this village. I'll die in it. In that order, I hope.`,lyra:`Charming. Charming enough to leave, charming enough to return.`,wren:`It's the best village ever! The only one I've seen, but still!`}],
 [['money','gold','coin','coins','prices','rich','poor','cost'],{maren:`Five a night, four for stew. Everyone pays. Except bards.`,brum:`Gold buys steel. Steel buys safety. Safety buys more gold. Simple.`,pip:`Sell me what you don't need, buy what you do. Everyone wins. Mostly me.`,odo:`Coins don't feed you in the woods. Arrows do.`,tobin:`Back in my day a coin bought a cow. Now it buys you a funny look.`,lyra:`Coins are small and shiny and perpetually elsewhere.`,wren:`I found a copper once! Spent it on a pie. Best day ever.`}],
 [['family','wife','husband','children','kids','parents','mother','father','brother','sister','son','daughter'],{maren:`Just me and the guests. My husband... well. He went into the hills one spring and didn't come home.`,brum:`Had a wife. She said I loved the anvil more. She wasn't wrong.`,pip:`A sister in the city. She sends letters about my "mustache." I don't have one.`,odo:`Just me and Biscuit. And the cabin.`,tobin:`Three sons, two daughters, eleven grandchildren, and not one of them visits.`,lyra:`Family? The road is mine. Everyone I meet is cousin to me.`,wren:`I live with my aunt. She's okay. She makes terrible soup.`}],
 [['danger','dangerous','safe','trouble','monsters','monster','threat'],{maren:`Wolves in the wood, bandits on the road, a troll under the bridge and goblins in the hills. But the beer's good, so we stay.`,brum:`Dangerous? Yes. Bring steel. Wear armor.`,pip:`Danger is a growth market. Potions, rope, torches. Everything's a bargain.`,odo:`Danger's in the woods. Always has been. Learn to listen.`,tobin:`I've seen worse. But I've forgotten what.`,lyra:`Danger is a good song with a bad ending. Avoid the ending.`,wren:`Goblins! Wolves! A TROLL! Isn't it great?`}],
 [['goblin','goblins','chief','hat'],{maren:`Goblins are thieves, not killers. Mostly. The chief's another story.`,brum:`Their blades are junk. But their chief's got real iron and a bad temper.`,pip:`Goblins steal anything. I've lost three lanterns and a perfectly good ladle.`,odo:`Hillside caves. Tracks lead right to them.`,tobin:`Goblins took our bell. Wouldn't have happened in my day. We had a Captain.`,lyra:`Goblins have the best taste in stolen goods. And the worst in hats.`,wren:`They live in a cave, past the troll! I've never been, but I've seen the smoke!`}],
 [['wolf','wolves','pack','howl'],{_:`Wolves keep to the wood east of the road. Bold this season. Bring a blade and a loaf of bread, in that order.`,odo:`Hungry wolves are easy. Tell them you're not food. Better yet, toss them some.`,wren:`I saw a wolf once! It was huge! Or a dog. Honestly, it might've been a dog.`}],
 [['bandit','bandits','robbers','thieves','highway','highwayman'],{_:`Bandits work the old road south of town. Keep your coin close.`,brum:`Cheap blades and thinner brains. They'll want your gold. Show them steel.`,lyra:`I've sung to bandits. They paid me in rope.`}],
 [['troll','toll','riddle','grudge'],{_:`The bridge troll wants ten gold, or a riddle answered. Or you can fight him, if you've got a death wish.`,maren:`Give him ten gold and be done. Nobody's ever beaten his riddle. Or so I hear.`,odo:`Answer his riddle with "echo". He hates that. Not that I told you.`,lyra:`Trolls love riddles, but weep at lullabies. I could teach you one, if you ask.`,wren:`The troll's name is Grudge! He lives under... on... the bridge!`}],
 [['bridge','river','ford','crossing'],{_:`The bridge is the only way across the river, short of a very cold swim.`,tobin:`Used to be a ford, before they built the bridge. Easier on the legs.`,wren:`I'm not allowed to go there. So obviously I've been.`}],
 [['cave','caves','cavern','hillside','hills','hill'],{_:`The hillside caves lie south over the river. Goblins live there. Take a light, because it's black as pitch.`,pip:`Torches, friend. Four coins. That cave's no place for guesswork.`,brum:`Goblin cave? Wear armor. Carry a shield. Pray.`,wren:`I heard there's treasure in the goblin cave! And a throne made of crates!`}],
 [['magic','spell','spells','wizard','mage','arcane','sorcery','witch'],{_:`Magic's rare in Thistledown. If you've got a gift, don't waste it on tricks.`,pip:`I sell nothing magic. I do sell a very bright torch, though.`,lyra:`Magic and music are cousins, really. Both change the room.`,wren:`Can you set stuff on fire? Please?`}],
 [['food','hungry','eat','jerky','ale','drink','dinner','supper'],{_:`The stew at the Gilded Boar's the best in the vale. Bread helps, too.`,pip:`Bread, apples and jerky, all freshly... recently... stocked.`,odo:`Roasted rabbit. Always roasted rabbit.`,lyra:`I've lived on songs and the generosity of strangers. Mostly the songs.`}],
 [['advice','tip','tips','hint','hints','suggest','suggestion','help'],{_:`Talk to everyone. Look everywhere. Never fight on an empty stomach.`,maren:`Rest at the inn when you can, eat when you must, and don't trust anything with too many legs.`,brum:`Armor first. Then a decent weapon. Then courage.`,pip:`Torches. Potions. Rope. In that order.`,odo:`Listen. The woods always tell you where the danger is.`,tobin:`Marry well, plant early, never trust a goblin.`,lyra:`If a door is locked, the answer is a key, a pick or a shove. Choose wisely.`,wren:`Ask EVERYONE about EVERYTHING. That's how you get the good stuff!`}],
 [['secret','secrets','hidden','treasure','loot','stash'],{_:`Secrets? Everyone's got a few. Mine aren't for sale.`,pip:`Secrets cost extra. Information is the best product, after all.`,lyra:`I know three, but they'd cost you a song.`,tobin:`There's a chest in the old tower. Everyone knows. Nobody's brave enough.`}],
 [['bye','goodbye','farewell','leaving','later','cheerio'],{maren:`Safe travels, love. Come home in one piece.`,brum:`Mind the road.`,pip:`Come back soon! Bring coin!`,odo:`Walk quiet.`,tobin:`Eh? Going already? Don't forget your hat. Everyone forgets their hat.`,lyra:`Until the next verse, friend!`,wren:`Bye! Come back and tell me everything!`}],
 [['thanks','thank','cheers','grateful','appreciate'],{maren:`Don't mention it, love.`,brum:`Hm. Welcome.`,pip:`Think nothing of it. Just buy something next time.`,odo:`Aye.`,tobin:`Eh? What for? Oh, don't thank me, thank the cabbages.`,lyra:`My pleasure, as always!`,wren:`You're welcome! Wait, what for?`}],
 [['joke','funny','jokes','laugh'],{maren:`Why did the goblin cross the bridge? Because the troll was out of change.`,brum:`Two swords walk into a tavern. The bartender says "I can't serve you, you're too sharp."`,pip:`Customer: "Is this a bargain?" Me: "Yes." Customer: "Why?" Me: "Because I said so."`,odo:`A wolf and a rabbit walk into a bar. One of them doesn't come out.`,tobin:`Back in my day a joke had a punchline. Now they just have punches.`,lyra:`A bard, a knight and a rogue walk into an inn. It's the beginning of a very long song.`,wren:`Knock knock! ... Who's there? ... Not you, apparently! Hee hee hee!`}],
 [['king','lord','queen','mayor','ruler','guard','guards','law','leader'],{_:`The nearest lord is two weeks away. In Thistledown, Maren is the law.`,brum:`Guards? Hah. We have a bell. We had a bell.`,tobin:`The Captain was the law. Now there's nobody.`,wren:`I'm gonna be mayor someday! Free pies for everyone.`}],
 [['love','romance','marry','marriage','sweetheart','heart'],{maren:`Love? It's a stew. Takes time, needs salt, gets better the second day.`,brum:`Hm. Not my department.`,pip:`I once courted the baker's daughter. She said I had a "transactional" heart.`,odo:`Biscuit's all the love I need.`,tobin:`I loved my wife. And she, my cabbages.`,lyra:`Oh, love's my favorite subject. And my worst-paying.`,wren:`Eww.`}],
 [['bell','stolen','bells','steal'],{_:`The village bell was stolen by goblins. We all want it back.`,brum:`Brass bell. Good casting. I'd know it by its ring.`,pip:`I'll pay well for its return, and I'm not even the mayor.`,odo:`Goblins have it, in the hillside caves.`,tobin:`It rang for my wedding, my sons' weddings and a few funerals. It's the heart of the place.`,lyra:`A village without a bell is a song without a rest.`,wren:`I heard they hang it in their cave! And ring it for fun!`}],
 [['well','wishing','fountain'],{_:`The village well's old, deep and clean. Folks toss coins in for luck. I wouldn't know about results.`,wren:`Toss a coin and wish! It works sometimes!`,tobin:`The well's older than the village. Something shiny's at the bottom. Nobody's climbed down to see.`}],
 [['dog','biscuit','hound'],{_:S=>S.q.dog>=2?`Biscuit made it home, I heard. Good news travels.`:`Odo's dog, Biscuit, has gone missing, I hear. He's up at his cabin, worried sick.`}],
 [['odo','hunter','cabin'],{_:`Odo the hunter lives in the cabin north of the clearing. Quiet man. Good heart.`,brum:`Odo buys arrowheads from me. Pays on time. Rare.`,wren:`Odo lets me look at his pelts! Never touch, though.`}],
 [['silverwake','sword','blade','weapon'],{_:`A good blade is worth the coin, if you know how to use it.`,brum:`Silverwake was mine to forge. Best work I ever did. Maren's husband carried it. Pity.`,pip:`I don't sell blades. Brum does.`,lyra:`Silverwake: a sword that sings when it's drawn. I'd love to write that one up.`}],
 [['torch','torches','light','dark','darkness','lantern'],{_:`Don't go into the caves without a light. Torches are cheap.`,pip:`Four coins. A bargain, considering what's in the dark.`,wren:`I'm not scared of the dark! I'm scared of what's IN the dark.`}],
 [['potion','potions','heal','healing','remedy'],{_:`Potions of healing are the best coin you can spend. Pip sells them.`,pip:`Twenty gold, and worth every coin. Taste like cherries and regret.`}],

 [['ruby','gem','jewel','jewels','gems'],{_:`Gems are worth good coin. Pip buys them.`,pip:`Uncut rubies? I could weep for joy. And pay well.`}],
 [['pelt','pelts','fur','hide','silk'],{_:`Pip buys pelts and spider silk. Wolf pelts keep folk warm, silk makes fine rope.`,odo:`I'd rather you left the wolves alone. But a good pelt's a good pelt.`}],

 [['wren','kid','child'],{_:`Wren? The kid in the square. Knows everything. Be nice.`}],
 [['maren','innkeeper'],{_:`Maren at the inn. Best stew in the vale, and a better arm than any guard.`}],

 inn:{n:'The Gilded Boar',s:'the inn',al:['inn','tavern','boar','gilded boar','pub'],x:{s:'square'},np:['maren','tobin','lyra'],safe:1,
  d:`A low, smoky common room full of mismatched tables and benches. A fire roars in the hearth, a staircase creaks up to the guest rooms, and Maren keeps watch over the bar. Old Tobin dozes in the corner while a bard tunes her lute. The only way out is south, back to the square.`,
  fx:[
   F('hearth',['fire','fireplace','flames','chimney'],`A crackling fire. Warm hands, warm hearts.`,{s:1,sm:`Woodsmoke and baking bread.`,ls:`Pops and crackles.`,ts:`You lick a flame. Do not do that.`,v:{use:`You warm your hands. Bliss.`,burn:`The fire is already doing a fine job.`,climb:`The chimney is narrow and sooty. You decide against it.`}}),
   F('bar',['counter','bartop'],`Scarred oak, polished by a thousand elbows. Behind it: kegs, mugs and a very old cat.`,{sm:`Spilled ale.`}),
   F('patrons',['crowd','customers','farmers','drinkers','guests','villagers'],`Farmers and travelers murmur over their mugs, listening to the rain. Old Tobin and Lyra the bard sit apart from the rest.`,{s:1,v:{talk:S=>avN(S,`The patrons nod politely. Perhaps you'd like to talk to Maren, old Tobin or Lyra.`)}}),
   F('tables',['table','benches','bench','chairs','chair','stools','stool','seat'],`Rough oak tables scored with decades of knife marks and initials.`,{st:`You settle onto a bench. It's the most comfortable thing you've sat on all week.`,v:{search:S=>avN(S,`Under the table you find sticky floor and an old, very dead beetle.`)}}),
   F('staircase',['stairs','upstairs','rooms','room','guest rooms','beds'],`Creaking wooden stairs lead up to the guest rooms. Maren charges five gold a night. (Just say "rest".)`,{cl:S=>avN(S,`Maren calls from the bar: "Rooms are five gold, love. Just say you want to rest."`)}),
   F('mugs',['mug','cups','kegs','keg','ale','tankards'],`Dented pewter mugs and a row of barrel-bellied kegs.`,{tt:`Maren's eyes track your hand. "Pay for it, love."`,sm:`Yeast and hops.`}),
   F('window',['shutters','glass','windows','rain'],`A small, rain-smeared window. Outside, the village glows gold and gray.`,{sm:`Wet wood and distant smoke.`,ls:`Rain. Always rain.`}),
   F('cat',['old cat','kitty','tabby'],`A fat gray tabby asleep on the bar. It opens one eye, judges you and closes it again.`,{pt:S=>avN(S,`You scratch the cat's chin. It purrs like a cart on cobbles and stares at you with deep, deep love. (Then it falls asleep.)`),tt:`The cat extends one claw and you reconsider.`})
  ],

 smithy:{n:`Brum's Forge`,s:'the smithy',al:['smithy','forge','blacksmith'],x:{w:'square'},np:['brum'],safe:1,

function avPanel(n){avPn=n;for(const k in AVPN)$(AVPN[k]).hidden=k!=n;$('avHeroes').hidden=n!='game';sub('avSub',n=='game'&&avS?avS.name:'')}
function avRoster(){avS=null;avPanel('roster');const c=Object.values(avChars()).sort((a,b)=>(b.tp||0)-(a.tp||0)),B=$('avRoster');
 let h=`<button class="big pri" id="avMk"><b>＋ New Character</b><small>Pick a class, name your hero and write a backstory</small></button>`;
 if(c.length)h+=`<div class="lbl">Your heroes</div>`;
 c.forEach(x=>{h+=`<div class="avch"><button class="big" data-p="${x.id}"><b></b><small></small></button><button class="bk" data-x="${x.id}" aria-label="Delete">✕</button></div>`});
 if(!c.length)h+=`<div class="card" style="margin-top:8px"><div class="sr"><span>No heroes yet. Create one to begin your story. Each hero keeps their own gear, progress and journal.</span></div></div>`;
 B.innerHTML=h;
 c.forEach(x=>{const b=B.querySelector(`[data-p="${x.id}"]`);b.querySelector('b').textContent=x.name;b.querySelector('small').textContent=`Level ${x.lv} ${AVC[x.cls].n} · ${AVRM[x.rm].n} · Day ${x.day}`});
 $('avMk').onclick=()=>{if(Object.keys(avChars()).length>=10)return askYN('You already have 10 heroes. Delete one to make room.',()=>{});avNewForm()};
 B.onclick=e=>{const p=e.target.closest('[data-p]'),x=e.target.closest('[data-x]');if(p)avLoad(p.dataset.p);else if(x){const ch=avChars()[x.dataset.x];askYN(`Delete ${ch.name}? Their whole story is lost for good.`,()=>{const all=avChars();delete all[ch.id];ST.set('av_chars',all);avRoster()})}}}
function avNewForm(){avPanel('new');$('avName').value='';$('avBg').value='';avCls='knight';
 const draw=()=>{seg('avClsB',Object.keys(AVC).map(k=>[k,AVC[k].n]),avCls,v=>{avCls=v;draw2()});draw2()},draw2=()=>{$('avClsD').textContent=AVC[avCls].de+` Starts with ${avLs(Object.values(AVC[avCls].eq).map(i=>AVI[i].n))}.`};draw();
 $('avBegin').onclick=()=>{const nm=$('avName').value.trim().slice(0,20);if(!nm){$('avName').focus();return}const S=avNew(nm,avCls,$('avBg').value.trim().slice(0,200));avS=S;avSave(S);avOpenGame('new')};
 $('avCancel').onclick=()=>avRoster()}
function avLoad(id){const S=avChars()[id];if(!S)return avRoster();avS=S;S.cb=!!(S.cb&&S.R[S.rm]&&S.R[S.rm].m);avOpenGame('load')}
function avLine(c,t){const d=document.createElement('div');d.className='av-'+c;d.textContent=t;$('avLog').appendChild(d)}
function avScroll(){const L=$('avLog');L.scrollTop=L.scrollHeight}
function avOpenGame(mode){avPanel('game');$('avLog').innerHTML='';
 if(mode=='new')avFlush(avS.log);else{avS.log.slice(-40).forEach(l=>avLine(l[0],l[1]));AVQ=[];if(mode=='load'){avO(avS,'s',`— Welcome back, ${avS.name}. —`);avLook(avS);avFlush(AVQ)}}
 avStatus();avSave();avScroll()}
function avFlush(lines){lines.forEach(l=>avLine(l[0],l[1]));AVQ=[]}
function avStatus(){const S=avS;if(!S)return;$('avHp').textContent=`HP ${Math.max(0,S.hp)}/${avMx(S)}`;$('avHp').style.color=S.hp<avMx(S)*.3?'var(--red)':'';$('avFc').textContent=`${AVC[S.cls].ab.split(' ')[0]} ${S.fc}/${S.fm}`;$('avGd').textContent=`${S.gold}g`;$('avLv').textContent=`Lv ${S.lv}`;
 const d=AVRM[S.rm],R=avRS(S,S.rm),c=[];
 const np=d.np||[];
 if(!S.cb&&S.tk&&np.includes(S.tk)){const N=AVN[S.tk];(N.hint||[]).slice(0,6).forEach(h=>c.push(['❝ '+h,'ask '+N.n.toLowerCase()+' about '+h]));c.push(['Goodbye','goodbye '+N.n.toLowerCase()])}
 if(S.cb){c.push(['⚔ Attack','attack'],['🛡 Defend','defend'],[AVC[S.cls].ab,AVC[S.cls].ab.toLowerCase()],['Flee','flee']);if(S.inv.potion)c.push(['Potion','drink potion'])}
 else{c.push(['Look','look']);Object.keys(d.x).forEach(k=>c.push([avUp(AVDN[k]),'go '+AVDN[k]]));
  if(R.i.length&&avLit(S))c.push(['Take all','take all']);np.forEach(i=>{if(i!=S.tk)c.push(['Talk to '+AVN[i].n,'talk to '+AVN[i].n.toLowerCase()])});if(d.np&&d.np.some(i=>AVN[i].sh))c.push(['Wares','wares']);if(R.m&&R.m.par)c.push(['Talk',R.m.id=='troll'?'talk to troll':'talk to chief']);if(S.rm=='inn'||d.out||d.safe)c.push(['Rest','rest'])}
 c.push(['Inventory','inventory'],['Stats','stats'],['Journal','journal']);
 const B=$('avCh');B.innerHTML='';c.forEach(([l,cmd])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>avSubmit(cmd);B.appendChild(b)})}
function avSubmit(t){if(!avS)return;t=(t||'').trim();if(!t)return;AVQ=[];const hp0=avS.hp,lv0=avS.lv;
 try{avRun(avS,t)}catch(e){avO(avS,'s','(Something odd happened. Try a different command.)');console.error(e)}
 const q=AVQ.slice();avFlush(q);avStatus();avSave();avScroll();$('avIn').value='';
 try{if(avS.hp<=0||q.some(l=>l[1]=='Everything goes dark...'))SFX.p('lose');else if(q.some(l=>l[0]=='b'))SFX.p('boom',.3);else if(avS.lv>lv0)SFX.p('win');else if(q.some(l=>l[0]=='g'))SFX.p('flag')}catch(e){}}
$('avGo').onclick=()=>{avSubmit($('avIn').value);$('avIn').focus()};
$('avIn').addEventListener('keydown',e=>{if(e.key=='Enter'){e.preventDefault();avSubmit($('avIn').value)}});
$('avAgain').onclick=()=>avSubmit('again');
$('avHeroes').onclick=()=>{avSave();avRoster()};
$('avBk').onclick=()=>{if(avPn=='new')avRoster();else history.back()};
function avView(){if(avS)avOpenGame('resume');else avRoster()}
function avHome(){const c=Object.values(avChars());return c.length?c.length+(c.length>1?' heroes':' hero')+' · Best level '+Math.max(...c.map(x=>x.lv)):'Create heroes and write your own story'}
const ENTER={
 adv:()=>avView(),
 mines:p=>{if(p){p.resume?msLoad():msNew(p.o.dif||'easy');return}if(!ms)return false;msRender()},
 sol:p=>{if(p){p.resume?solLoad():solNew(p.o.dif||'easy');return}if(!sol)return false;solRender()},
 gal:p=>{const W=gaW.clientWidth,H=gaW.clientHeight;
  if(p){gaO={dif:p.o.dif||'med'};const sv=p.resume?SV.get('gal'):null;gaInit(W,H,sv?sv.s:null)}
  else if(!ga)return false;
  else{if(ga.W!=W||ga.H!=H){gaO.dif=ga.dif;gaInit(W,H,gaExport())}if(ga.started&&!ga.over)ga.paused=true}
  ga.last=0;requestAnimationFrame(gaLoop)},
 bub:p=>{const W=bbW.clientWidth,H=bbW.clientHeight;
  if(p){bbO={dif:p.o.dif||'med'};const sv=p.resume?SV.get('bub'):null;bbInit(W,H,sv?sv.s:null);if(sv&&bb.started)bb.paused=true}
  else if(!bb)return false;
  else{if(bb.W!=W||bb.H!=H){bbO.dif=bb.dif;bbInit(W,H,bbExport())}if(bb.started&&!bb.over)bb.paused=true}
  bb.last=0;requestAnimationFrame(bbLoop)},
 chess:p=>{if(p){p.resume?chLoad():chBegin(p.o);return}if(!ch)return false;chRender()},
 stick:()=>skShow(),
 pool:p=>{const W=plW.clientWidth,H=plW.clientHeight;
  if(p){const o=p.o||{};plO={mode:o.mode||'2p',dif:o.mode?(o.dif||'med'):'med',gd:o.gd||(o.mode?'full':({med:'short',hard:'none'}[o.dif]||'full'))};const sv=p.resume?SV.get('pool'):null;plInit(W,H,sv?sv.s:null)}
  else if(!pl)return false;else if(pl.W!=W||pl.H!=H)plInit(W,H,plExport());
  pl.last=0;requestAnimationFrame(plLoop)},
 fruit:p=>{const W=frW.clientWidth,H=frW.clientHeight;
  if(p){frO={dif:p.o.dif||'med'};const sv=p.resume?SV.get('fruit'):null;frInit(W,H,sv?sv.s:null)}
  else if(!fr)return false;else if(fr.W!=W||fr.H!=H)frInit(W,H,frExport());
  fr.last=0;requestAnimationFrame(frLoop)},
 brick:p=>{const W=brW.clientWidth,H=brW.clientHeight;
  if(p){brO={dif:p.o.dif||'med'};const sv=p.resume?SV.get('brick'):null;brInit(W,H,sv?sv.s:null);if(sv&&br.started)br.paused=true}
  else if(!br)return false;
  else{if(br.W!=W||br.H!=H){brO.dif=br.dif;brInit(W,H,brExport())}if(br.started&&!br.over)br.paused=true}
  br.last=0;requestAnimationFrame(brLoop)},
 dino:p=>{const W=rnW.clientWidth,H=rnW.clientHeight;
  if(p){rnO={dif:p.o.dif||'med'};rnInit(W,H)}
  else if(!rn)return false;
  else{if(rn.W!=W||rn.H!=H){rnO.dif=rn.dif;rnInit(W,H)}if(rn.run&&!rn.dead)rn.paused=true}
  rn.last=0;requestAnimationFrame(rnLoop)}
};
/* keep an old Fruit Merge best score as the Medium record */
(function(){const o=ST.get('fr_best',0);if(o&&!scGet('fruit','med',null))scMod('fruit','med',{best:0},x=>{x.best=o})})();
(function(){['sv_c4','sv_gw','opt_c4','opt_gw','sv_check','opt_check'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});const sc=ST.get('sc',{});if(sc.c4||sc.gw||sc.check){delete sc.c4;delete sc.gw;delete sc.check;ST.set('sc',sc)}})();
homeStats();
</script></body></html>
